[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cohub"
version = "0.1.0"
description = "Local multi-CLI Agent workflow coordinator (Claude Code / Codex)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "xxy" }]
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "anthropic>=0.40",
]

[project.scripts]
cohub = "cohub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cohub = ["adapters/*.py"]
